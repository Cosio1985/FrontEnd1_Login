<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Cliente JWT - Django</title>
  <style>
    body { font-family: sans-serif; padding: 40px; max-width: 400px; margin: auto; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, button { padding: 10px; font-size: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>Autenticación con Django JWT</h2>

  <!-- Formulario de Login -->
  <div id="section-login">
    <form id="form-login">
      <input type="text" id="username" placeholder="Usuario" required />
      <input type="password" id="password" placeholder="Contraseña" required />
      <button type="submit">Iniciar Sesión</button>
    </form>
  </div>

  <!-- Vista Protegida -->
  <div id="section-perfil" class="hidden">
    <h3>¡Bienvenido a la vista protegida!</h3>
    <p id="user-info"></p>
    <button id="btn-logout">Cerrar Sesión</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
